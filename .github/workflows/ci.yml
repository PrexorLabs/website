name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generated design tokens are up to date
        run: pnpm tokens:check

      - name: Formatting
        run: pnpm format:check

      - name: Lints and type checks
        run: |
          pnpm --filter @prexorlabs/web lint
          pnpm --filter @prexorlabs/web check
          pnpm --filter @prexorlabs/lab-feed lint
          pnpm --filter @prexorlabs/lab-feed check

      - name: Lab feed tests
        run: pnpm --filter @prexorlabs/lab-feed test

      - name: Build
        run: pnpm --filter @prexorlabs/web build

      # Performance at 0.95 rather than 1 because shared runners vary between runs. Largest contentful paint may
      # take up to 2 s under Lighthouse's throttled phone profile (slow 4G); Google counts up to 2.5 s as good.
      # The weight budget of 100 KB and the other three categories are strict. Screenshots on a project page get a
      # budget of their own, 100 KB, because phones fetch lazy images that sit just below the fold. The pages are
      # served from a plain file server without the Worker, so the browser's request to /api/lab fails; the console
      # error audit is skipped for that reason only.
      - name: Lighthouse
        run: pnpm dlx @lhci/cli@0.15.1 autorun

      # A preview version of the Worker per pull request, at pr-<number>-prexorlabs-web.<account>.workers.dev.
      # Pull requests from forks get no secrets and skip this step.
      - name: Preview deploy
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: apps/web
        run: pnpm exec wrangler versions upload --preview-alias pr-${{ github.event.pull_request.number }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The feed goes first: the site's service binding and its next build read from it.
      - name: Deploy the lab feed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/lab-feed
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: apps/web
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
